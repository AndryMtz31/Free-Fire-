name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dylib:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Diagnostico
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcodebuild -version || true
          xcode-select -p || true
          which git make xcrun perl || true
          ls -la "$GITHUB_WORKSPACE" || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          chmod +x "$THEOS/bin/"* 2>/dev/null || true
          "$THEOS/bin/ldid" -v || true

      - name: Compilar
        env:
          THEOS: ${{ github.workspace }}/theos
          ARCHS: arm64 arm64e
          DEBUG: "0"
        run: |
          set -euxo pipefail
          make clean || true
          make

      - name: Localizar el dylib
        if: always()
        run: |
          set -x
          find "$GITHUB_WORKSPACE" -name '*.dylib' -not -path '*/theos/*' 2>/dev/null || true

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/_/**/*.dylib
          if-no-files-found: warn
