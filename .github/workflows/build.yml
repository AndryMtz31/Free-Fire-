name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dylib:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnostico
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcodebuild -version || true
          xcode-select -p || true
          which git make xcrun perl || true
          ls -la "$GITHUB_WORKSPACE" || true

      - name: Instalar Theos y ldid
        run: |
          curl -fsSL -o "$THEOS/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_macosx_arm64
          chmod +x "$THEOS/bin/ldid"
          "$THEOS/bin/ldid" -v

      - name: Compilar
        env:
          THEOS: ${{ github.workspace }}/theos
          DEBUG: "0"
        run: |
          set -euxo pipefail
          make clean || true
          make

      - name: Localizar el dylib
        if: always()
        run: |
          set -x
          find "$GITHUB_WORKSPACE" -name '*.dylib' -not -path '*/theos/*' 2>/dev/null || true

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAimbot-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/_/**/*.dylib
          if-no-files-found: warn
